
name: Build NOVA CHAMPIONS APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Get files
        uses: actions/checkout@v4

      - name: Extract Android project
        run: |
          unzip -q NOVA_CHAMPIONS_Android_Source.zip -d source
          PROJECT_DIR=$(find source -name settings.gradle -print -quit | xargs dirname)
          cp -a "$PROJECT_DIR"/. .

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build APK
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NOVA-CHAMPIONS-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          
